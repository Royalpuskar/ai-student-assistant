name: Verify StudyNest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: |
          node --check core.mjs
          node --check app.mjs
          node --check backend/server.js
          test -s index.html
          test -s style.css
          grep -q 'type="module"' index.html
